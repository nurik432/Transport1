# Проверки, сборка образа и деплой на Dokku при каждом пуше в main.
# Образ собирается здесь, на раннере GitHub, и публикуется в GHCR; Dokku только
# скачивает готовый образ (git:from-image). Сборка на самом сервере шла ~18 минут,
# здесь — пару минут. Разовая настройка сервера — в docs/deploy-dokku.md.
# Нужен секрет репозитория DOKKU_SSH_PRIVATE_KEY.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Имя образа в GHCR только строчными буквами.
  IMAGE: ghcr.io/nurik432/transport1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Сборка Next.js идёт в задаче image, параллельно с этими проверками.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docs:faq:check

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Секретов в образе нет: база, ключи и адреса задаются на сервере через
      # dokku config. Поэтому образ можно держать публичным.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          # Тег — хеш коммита: Dokku не передеплоит образ с тем же именем.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, image]
    # Ручной запуск с другой ветки проверяет и собирает образ, но не выкатывает.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: dokku/github-action@master
        with:
          git_remote_url: ssh://dokku@89.125.120.7:58595/transport
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          deploy_docker_image: ${{ env.IMAGE }}:${{ github.sha }}
