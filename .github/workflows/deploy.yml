# Проверки и деплой на Dokku при каждом пуше в main.
# Нужен секрет репозитория DOKKU_SSH_PRIVATE_KEY (см. docs/deploy-dokku.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # От дешёвых проверок к дорогим: сборка идёт последней, чтобы очевидная
      # ошибка не ждала её полторы минуты.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docs:faq:check
      # Базы данных сборке не нужно: клиент в lib/db.ts создаётся лениво, а
      # статически рендерятся только страницы ошибок, favicon и манифест.
      # Поэтому DATABASE_URL сюда не пробрасывается: на продакшене его задаёт
      # dokku postgres:link, и раннеру сборки эти доступы ни к чему.
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dokku/github-action@master
        with:
          git_remote_url: ssh://dokku@89.125.120.7:58595/transport
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          branch: main
