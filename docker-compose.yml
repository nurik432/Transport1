services:
  db:
    image: postgres:16-alpine
    container_name: transport1-db
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
